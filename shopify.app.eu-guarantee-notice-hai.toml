# Configuration for the hosted app (EU Guarantee Notice HAI).

client_id = "635708be3791da865605a329fcbe6cf6"
name = "EU Guarantee Notice HAI"
application_url = "https://eu-guarantee-notice.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "heard-ai-dev-store.myshopify.com"

[access_scopes]
# read_products: needed to read product type and tags for the exclusion rules.
# Shop display settings are stored in the app's own metafield.
scopes = "read_products"

[auth]
redirect_urls = [
  "https://eu-guarantee-notice.onrender.com/auth/callback",
  "https://eu-guarantee-notice.onrender.com/auth/shopify/callback",
  "https://eu-guarantee-notice.onrender.com/api/auth/callback",
]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
