# Render deployment for the EU guarantee notice app.
#
# DATABASE_URL, SHOPIFY_API_KEY, SHOPIFY_API_SECRET and SHOPIFY_APP_URL are set
# in the Render dashboard rather than here — the secret must never live in the
# repository.

services:
  - type: web
    name: eu-guarantee-notice
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run setup && npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SCOPES
        value: read_products
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
